<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .fade1{opacity:0;animation:in .8s ease-out .2s forwards}
    .fade2{opacity:0;animation:in .8s ease-out .7s forwards}
    .fade3{opacity:0;animation:in .8s ease-out 1.2s forwards}
    .hl{transform-origin:left;transform:scaleX(0);animation:hl .7s ease-out 1.6s forwards}
    .blink{animation:blink 1s steps(1) infinite}
    .scan{animation:scan 6s linear infinite}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes hl{to{transform:scaleX(1)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(340px)}}
    @keyframes float{50%{transform:translateY(-8px)}}
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F8D907" stroke-opacity=".07"/></pattern>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#010409" stop-opacity="0"/><stop offset="1" stop-color="#010409"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="320" fill="#010409"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="scan" width="1200" height="40" fill="#F8D907" opacity=".035"/>

    <!-- left text -->
    <g class="fade1"><text x="64" y="86" fill="#F8D907" font-size="16" font-weight="700" letter-spacing="5">PLAYER 01 · READY</text></g>
    <g class="fade1"><text x="64" y="128" fill="#94a3b8" font-size="30" font-weight="600">வணக்கம், I'm</text></g>
    <g class="fade2"><text x="60" y="200" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">ARAVINDSAMY</text></g>
    <rect class="hl" x="64" y="245" width="372" height="12" fill="#F8D907" opacity=".45"/>
    <g class="fade3"><text x="66" y="252" fill="#ffffff" font-size="24" font-weight="600">Founder · Developer · Educator</text></g>
    <g class="fade3"><text x="66" y="290" fill="#64748b" font-size="16" font-family="Consolas, 'Courier New', monospace">&gt; building websites, games &amp; Tamil coding courses<tspan class="blink" fill="#F8D907"> █</tspan></text></g>

    <!-- right: pixel controller -->
    <g class="float" transform="translate(860 70)">
      <rect x="0" y="40" width="250" height="120" rx="60" fill="#0b1220" stroke="#F8D907" stroke-width="3"/>
      <rect x="45" y="88" width="50" height="16" fill="#F8D907"/>
      <rect x="62" y="71" width="16" height="50" fill="#F8D907"/>
      <circle cx="180" cy="80" r="11" fill="#F8D907"/>
      <circle cx="205" cy="104" r="11" fill="#e8edf5"/>
      <circle cx="155" cy="104" r="11" fill="#e8edf5" opacity=".5"/>
      <circle cx="180" cy="128" r="11" fill="#F8D907" opacity=".6"/>
      <text x="125" y="200" text-anchor="middle" fill="#64748b" font-size="13" letter-spacing="4" font-family="Consolas, monospace">PRESS START</text>
    </g>
    <rect x="1080" y="0" width="120" height="320" fill="url(#fadeR)" opacity=".4"/>
  </g>
</svg>
