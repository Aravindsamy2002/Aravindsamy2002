<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <style>
    .bar{transform-origin:left;transform:scaleX(0);animation:fill 1.2s cubic-bezier(.2,.8,.2,1) forwards}
    .b1{animation-delay:.3s}.b2{animation-delay:.5s}.b3{animation-delay:.7s}.b4{animation-delay:.9s}.b5{animation-delay:1.1s}
    .xp{transform-origin:left;transform:scaleX(0);animation:fill 2s ease-out .4s forwards}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes fill{to{transform:scaleX(1)}}
    @keyframes pulse{50%{opacity:.35}}
    .lbl{fill:#94a3b8;font-size:13px;font-weight:700;letter-spacing:3px}
    .stat{fill:#e8edf5;font-size:17px;font-weight:600}
    .num{fill:#F8D907;font-size:15px;font-weight:700;font-family:Consolas,monospace}
    .item{fill:#cbd5e1;font-size:16px}
  </style>
  <rect width="1200" height="430" rx="18" fill="#010409"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" fill="none" stroke="#F8D907" stroke-opacity=".25"/>

  <!-- header -->
  <text x="48" y="58" class="lbl">CHARACTER SELECT</text>
  <circle class="pulse" cx="1140" cy="52" r="6" fill="#22c55e"/>
  <text x="1124" y="57" text-anchor="end" fill="#22c55e" font-size="13" font-weight="700" letter-spacing="2">ONLINE</text>
  <line x1="48" y1="78" x2="1152" y2="78" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- left: class card -->
  <rect x="48" y="104" width="330" height="290" rx="12" fill="#0b1220"/>
  <rect x="48" y="104" width="330" height="6" rx="3" fill="#F8D907"/>
  <text x="76" y="150" class="lbl">CLASS</text>
  <text x="76" y="186" fill="#ffffff" font-size="26" font-weight="800">Builder · Teacher</text>
  <text x="76" y="228" class="lbl">LEVEL</text>
  <text x="76" y="268" fill="#F8D907" font-size="40" font-weight="800">24</text>
  <text x="136" y="268" fill="#64748b" font-size="15">XP to next level</text>
  <rect x="76" y="284" width="274" height="10" rx="5" fill="#1e293b"/>
  <rect class="xp" x="76" y="284" width="210" height="10" rx="5" fill="#F8D907"/>
  <text x="76" y="334" class="lbl">HOME BASE</text>
  <text x="76" y="364" fill="#e8edf5" font-size="18" font-weight="600">Tamil Nadu, India</text>

  <!-- middle: stats -->
  <text x="430" y="130" class="lbl">STATS</text>
  <g transform="translate(430 160)">
    <text y="0" class="stat">Web Development</text><text x="380" y="0" text-anchor="end" class="num">95</text>
    <rect y="12" width="380" height="8" rx="4" fill="#1e293b"/><rect class="bar b1" y="12" width="361" height="8" rx="4" fill="#F8D907"/>
    <text y="56" class="stat">Game Dev &amp; 3D</text><text x="380" y="56" text-anchor="end" class="num">82</text>
    <rect y="68" width="380" height="8" rx="4" fill="#1e293b"/><rect class="bar b2" y="68" width="312" height="8" rx="4" fill="#F8D907"/>
    <text y="112" class="stat">Teaching (Tamil)</text><text x="380" y="112" text-anchor="end" class="num">90</text>
    <rect y="124" width="380" height="8" rx="4" fill="#1e293b"/><rect class="bar b3" y="124" width="342" height="8" rx="4" fill="#F8D907"/>
    <text y="168" class="stat">Automation &amp; Tools</text><text x="380" y="168" text-anchor="end" class="num">85</text>
    <rect y="180" width="380" height="8" rx="4" fill="#1e293b"/><rect class="bar b4" y="180" width="323" height="8" rx="4" fill="#F8D907"/>
    <text y="224" class="stat">Coffee Consumption</text><text x="380" y="224" text-anchor="end" class="num">MAX</text>
    <rect y="236" width="380" height="8" rx="4" fill="#1e293b"/><rect class="bar b5" y="236" width="380" height="8" rx="4" fill="#e8edf5"/>
  </g>

  <!-- right: abilities -->
  <text x="870" y="130" class="lbl">SPECIAL ABILITIES</text>
  <g transform="translate(870 166)">
    <rect width="12" height="12" y="-11" fill="#F8D907"/><text x="24" class="item">Websites that bring leads</text>
    <rect width="12" height="12" y="33" fill="#F8D907"/><text x="24" y="44" class="item">CRMs &amp; SEO tools</text>
    <rect width="12" height="12" y="77" fill="#F8D907"/><text x="24" y="88" class="item">Unity games &amp; archviz</text>
    <rect width="12" height="12" y="121" fill="#F8D907"/><text x="24" y="132" class="item">Coding courses in Tamil</text>
    <rect width="12" height="12" y="165" fill="#F8D907"/><text x="24" y="176" class="item">Trading tools &amp; bots</text>
  </g>
  <rect x="870" y="364" width="282" height="30" rx="6" fill="none" stroke="#F8D907" stroke-opacity=".5"/>
  <text x="1011" y="384" text-anchor="middle" fill="#F8D907" font-size="13" font-weight="700" letter-spacing="3">ULTIMATE: SHIP IT FAST</text>
</svg>
