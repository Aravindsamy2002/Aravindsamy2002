<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<style>
.dot{fill:#f4efe2;opacity:0;animation:pop .35s ease-out forwards}
.line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw 1.6s ease-in-out forwards}
.t{opacity:0;animation:fade .9s ease-out forwards}
@keyframes pop{to{opacity:.9}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dot,.line,.t{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<rect width="1200" height="430" rx="14" fill="#0a0d12"/>
<rect width="1200" height="430" rx="14" fill="url(#grain)" opacity=".5"/>
<defs><pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#ffffff" opacity=".035"/><circle cx="4" cy="4" r=".5" fill="#ffffff" opacity=".025"/></pattern></defs>
<g class="t" style="animation-delay:.2s"><text x="72" y="96" fill="#F8D907" font-family="'Nirmala UI','Tamil Sangam MN','Noto Sans Tamil','Latha',sans-serif" font-size="22" font-weight="600">வாசல்</text>
<text x="170" y="96" fill="#8b93a1" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-style="italic">vaasal · n. the doorstep</text></g>
<g class="t" style="animation-delay:.5s"><text x="68" y="180" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="72" letter-spacing="-1">Aravindsamy</text></g>
<g class="t" style="animation-delay:.9s" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#b9c0cb">
<text x="72" y="236">In Tamil homes, a kolam is drawn at the vaasal</text>
<text x="72" y="264">every morning to welcome whoever comes by.</text>
<text x="72" y="306" fill="#ffffff">This one is drawn by code. <tspan fill="#F8D907">Welcome in.</tspan></text></g>
<g class="t" style="animation-delay:1.3s"><line x1="72" y1="350" x2="112" y2="350" stroke="#F8D907" stroke-width="2"/>
